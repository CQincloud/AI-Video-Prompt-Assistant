<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炬成 AI 视频提示词后台管理系统</title>
    <link rel="stylesheet" href="/static/admin.css?v=20260525-admin-entry1">
</head>
<body class="admin-login-page">
    <main class="login-card">
        <div class="admin-login-mark" aria-hidden="true"></div>
        <p class="eyebrow">ADMIN CONSOLE</p>
        <h1>管理后台</h1>
        <p class="subtitle">管理员使用手机号验证码登录。系统将校验账号角色与后台权限。</p>

        <form id="adminLoginForm" class="form-grid" novalidate>
            <label class="field">
                <span>手机号</span>
                <input id="phoneInput" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="请输入手机号">
            </label>

            <label class="field">
                <span>验证码</span>
                <div class="code-row">
                    <input id="codeInput" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="请输入验证码">
                    <button id="sendCodeBtn" class="btn btn-secondary" type="button">获取验证码</button>
                </div>
            </label>

            <p id="loginMessage" class="message" aria-live="polite"></p>
            <button id="loginBtn" class="btn btn-primary" type="submit">登录后台</button>
        </form>

        <a class="back-to-app" href="/login">返回创作中枢</a>
    </main>

    <script src="/static/admin-login.js?v=20260525-admin-entry1"></script>
</body>
</html>
